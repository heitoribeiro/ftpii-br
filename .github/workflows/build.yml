name: build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitppc:20250527
    steps:
      - uses: actions/checkout@v4
      - run: make
      - name: Package for the Homebrew Channel
        run: |
          mkdir -p pkg/apps/ftpiibr
          cp ftpii.dol pkg/apps/ftpiibr/boot.dol
          cp hbc/icon.png hbc/meta.xml pkg/apps/ftpiibr/
      - uses: actions/upload-artifact@v4
        with:
          name: ftpii-br
          path: pkg
      - name: Symbolize crash addresses (debug/addrs.txt)
        if: hashFiles('debug/addrs.txt') != ''
        run: |
          /opt/devkitpro/devkitPPC/bin/powerpc-eabi-addr2line -f -i -C -e build/_ftpii.elf $(cat debug/addrs.txt)
